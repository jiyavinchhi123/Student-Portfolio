# ==============================================================================
# Full-Stack Task Management & Portfolio Multi-Container Orchestration
# Services: Frontend (React/Vite) ──► Backend (Express API) ──► Database (MongoDB)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Database Service: Official MongoDB Engine
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:6
    container_name: task-manager-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      # Named volume to persist MongoDB data across container restarts/rebuilds
      - mongo-data:/data/db
    networks:
      - app-network
    # Resource Limits for Database Service
    mem_limit: 512m
    cpus: 1.0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ----------------------------------------------------------------------------
  # 2. Backend Service: Node.js / Express REST API (with In-Memory Caching & EventEmitter)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./task-manager-api
      dockerfile: Dockerfile
    container_name: task-manager-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # Uses the Docker network service name 'mongodb' instead of localhost
      - MONGO_URI=mongodb://mongodb:27017/taskmanager
    depends_on:
      - mongodb
    networks:
      - app-network
    # Resource Limits (Cloud Computing: Memory & CPU Constraints)
    # Works across both Compose standalone (mem_limit/cpus) and Swarm (deploy.resources)
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M

  # ----------------------------------------------------------------------------
  # 3. Frontend Service: React + Vite Portfolio Dashboard
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-manager-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network
    # Resource Limits for Frontend Service
    mem_limit: 128m
    cpus: 0.25
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

# ------------------------------------------------------------------------------
# Isolated Bridge Network for Inter-Container Communication & Service Discovery
# ------------------------------------------------------------------------------
networks:
  app-network:
    driver: bridge

# ------------------------------------------------------------------------------
# Persistent Volume for Database Storage
# ------------------------------------------------------------------------------
volumes:
  mongo-data:
    driver: local
