# ==============================================================================
# Full-Stack Task Management & Portfolio Multi-Container Orchestration
# Services: Frontend (React/Vite) ──► Backend (Express API) ──► Database (MongoDB)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Database Service: Official MongoDB Engine
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:6
    container_name: task-manager-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      # Named volume to persist MongoDB data across container restarts/rebuilds
      - mongo-data:/data/db
    networks:
      - app-network
    # Resource Limits for Database Service
    mem_limit: 512m
    cpus: 1.0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ----------------------------------------------------------------------------
  # 2. Blue Backend Service: Active Production Version (Port 5000)
  # ----------------------------------------------------------------------------
  backend-blue:
    build:
      context: ./task-manager-api
      dockerfile: Dockerfile
    container_name: task-manager-backend-blue
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - VERSION=blue
      - MONGO_URI=mongodb://mongodb:27017/taskmanager
    depends_on:
      - mongodb
    networks:
      - app-network
    # Resource Limits & Reservations
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M

  # ----------------------------------------------------------------------------
  # 3. Green Backend Service: Staging / Next Release Version (Port 5001)
  # ----------------------------------------------------------------------------
  backend-green:
    build:
      context: ./task-manager-api
      dockerfile: Dockerfile
    container_name: task-manager-backend-green
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - VERSION=green
      - MONGO_URI=mongodb://mongodb:27017/taskmanager
    depends_on:
      - mongodb
    networks:
      - app-network
    # Resource Limits & Reservations
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M

  # ----------------------------------------------------------------------------
  # 4. Frontend Service: React + Vite Portfolio Dashboard
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-manager-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend-blue
      - backend-green
    networks:
      - app-network
    # Resource Limits for Frontend Service
    mem_limit: 128m
    cpus: 0.25
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

# ------------------------------------------------------------------------------
# Isolated Bridge Network for Inter-Container Communication & Service Discovery
# ------------------------------------------------------------------------------
networks:
  app-network:
    driver: bridge

# ------------------------------------------------------------------------------
# Persistent Volume for Database Storage
# ------------------------------------------------------------------------------
volumes:
  mongo-data:
    driver: local
